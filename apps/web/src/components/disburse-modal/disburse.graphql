query PayrollsForDisburse {
  payrolls {
    id
    name
    schedule
    customDays
    employees {
      employeeId
      employee {
        id
        name
        walletAddress
        salaryAmount
      }
    }
  }
}

mutation StartPayrollRun($payrollId: ID!) {
  startPayrollRun(payrollId: $payrollId) {
    id
    status
    zecPriceUsd
    payments {
      id
      amountUsd
      amountZec
      memo
      status
      employee {
        name
        walletAddress
      }
    }
  }
}

mutation UpdatePaymentStatus(
  $paymentId: ID!
  $status: PaymentStatus!
  $txHash: String
) {
  updatePaymentStatus(
    paymentId: $paymentId
    status: $status
    txHash: $txHash
  ) {
    id
    status
  }
}

mutation CompletePayrollRun($runId: ID!) {
  completePayrollRun(runId: $runId) {
    id
    status
  }
}
