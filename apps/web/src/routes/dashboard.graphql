query DashboardStats {
  dashboardStats {
    zecSpentByMonth {
      month
      amount
    }
  }
  payrolls {
    id
    name
    schedule
    customDays
    employees {
      employeeId
      employee {
        id
        name
        salaryAmount
      }
    }
    runs {
      id
      status
      createdAt
    }
  }
}
