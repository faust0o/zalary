query MeLayout {
  me {
    id
    username
    name
    isAccountOwner
    role
    canEditPayroll
    hasPasskey
    commsPublicKey
    owner {
      id
      username
    }
  }
  treasury {
    id
    status
    address
    changeAddress
    birthdayHeight
    encryptedViewingKey
    isCoordinator
    sealedBalance
    coordinator {
      id
      commsPublicKey
    }
    myMembership {
      id
      encryptedKeyPackage
      viewingKeyMessage
    }
  }
}
