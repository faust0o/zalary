query MeSettings {
  me {
    id
    email
    zcashViewingKey
    walletBirthdayHeight
  }
}

mutation UpdateUser($zcashViewingKey: String, $walletBirthdayHeight: Int) {
  updateUser(zcashViewingKey: $zcashViewingKey, walletBirthdayHeight: $walletBirthdayHeight) {
    id
    zcashViewingKey
    walletBirthdayHeight
  }
}
