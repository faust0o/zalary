query MeSettings {
  me {
    id
    username
    name
    owner {
      id
      username
    }
    isAccountOwner
    role
  }
}

mutation ChangePassword($currentPassword: String!, $newPassword: String!) {
  changePassword(currentPassword: $currentPassword, newPassword: $newPassword) {
    token
    user {
      id
      username
    }
  }
}

mutation DeleteAccount($treasuryEmpty: Boolean) {
  deleteAccount(treasuryEmpty: $treasuryEmpty)
}
