mutation RegisterUser(
  $email: String!
  $tribeUserId: String!
  $zcashViewingKey: String
) {
  registerUser(
    email: $email
    tribeUserId: $tribeUserId
    zcashViewingKey: $zcashViewingKey
  ) {
    id
    email
    zcashViewingKey
  }
}

query Me {
  me {
    id
    email
    zcashViewingKey
  }
}
